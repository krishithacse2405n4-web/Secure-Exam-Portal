name: ExamVault CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Application Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Automated Test Suite
        env:
          SECRET_KEY: ci-test-secret-key-32chars
          DB_TYPE: sqlite
        run: |
          python -m unittest discover tests -v

  docker-build:
    name: Build & Verify Docker Container
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Dockerfile Build
        run: |
          docker build -t examvault:ci-test .

      - name: Validate Docker Compose Configuration
        env:
          SECRET_KEY: test-secret-key
          DB_NAME: examvault
          DB_USER: examvault_user
          DB_PASSWORD: test-password
          MYSQL_ROOT_PASSWORD: test-root-password
        run: docker compose config

      - name: Verify Container Startup & Health
        run: |
          docker run -d --name test_app -p 5003:5003 -e SECRET_KEY=ci-test-key examvault:ci-test
          sleep 5
          docker ps
          curl --fail http://localhost:5003/health || (docker logs test_app && exit 1)
          docker stop test_app
