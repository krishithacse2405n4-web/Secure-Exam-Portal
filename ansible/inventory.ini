# ==============================================================
# ExamVault Ansible Inventory
# Configure your staging and production target hosts
# ==============================================================

[production]
# Replace with your production server IP and SSH user
examvault_prod ansible_host=127.0.0.1 ansible_connection=local ansible_user=root

[staging]
# Replace with your staging server IP
examvault_stage ansible_host=127.0.0.1 ansible_connection=local ansible_user=root

[all:vars]
ansible_python_interpreter=/usr/bin/python3
app_name=examvault
app_dir=/opt/examvault
app_port=5003
