name: ExamVault CD Pipeline

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - staging
          - production
  push:
    tags:
      - 'v*'

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core

      - name: Validate Ansible Playbook Syntax
        run: |
          ansible-playbook -i ansible/inventory.ini ansible/deploy.yml --syntax-check

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config

      - name: Deployment Simulation / Execution
        run: |
          echo "=========================================================="
          echo "Deploying ExamVault to Target: ${{ github.event.inputs.environment || 'production' }}"
          echo "Ansible playbooks validated and ready for target deployment."
          echo "=========================================================="
